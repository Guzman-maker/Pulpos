<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresa a Pulpos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --title:#161a2c;
    --text:#374151;
    --muted:#9ca3af;
    --placeholder:#6b7280;
    --border:#d1d5db;
    --btn-off-bg:#f3f4f6;
    --btn-off-text:#6b7280;
    --btn-on-bg:#4aa3b0;
    --btn-on-text:#ffffff;
    --link:#2f80b7;
    --logo:#4aa3b0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  /* Resplandor superior */
  body::before{
    content:"";
    position:absolute;inset:0 0 auto 0;height:110px;
    background:
      radial-gradient(ellipse 22% 80% at 38% 0%, rgba(233,213,255,.45), transparent 100%),
      radial-gradient(ellipse 30% 100% at 90% 0%, rgba(186,230,230,.55), transparent 100%),
      radial-gradient(ellipse 25% 90% at 8% 20%, rgba(204,238,238,.45), transparent 100%);
    pointer-events:none;
  }
  main{
    position:relative;
    width:min(calc(100% - 120px),380px);
    margin:0 auto;
    padding-top:max(127px, env(safe-area-inset-top, 0px));
    text-align:center;
  }
  .logo{width:29px;height:auto;display:block;margin:0 auto}
  h1{
    margin-top:24px;
    font-size:24px;line-height:32px;font-weight:600;color:var(--title);
    letter-spacing:-.01em;
  }
  .google{
    margin-top:48px;
    width:100%;height:44px;
    display:flex;align-items:center;justify-content:center;gap:12px;
    background:#fff;border:1px solid var(--border);border-radius:6px;
    font:500 16px/1 'Inter',sans-serif;color:var(--text);cursor:pointer;
    transition:background .15s;
  }
  .google:hover{background:#f9fafb}
  .google svg{width:18px;height:18px}
  .divider{
    margin:25px 0 23px;
    display:flex;align-items:center;gap:22px;
    color:var(--muted);font-size:14px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
  input[type=email]{
    width:100%;height:38px;padding:0 13px;
    border:1px solid var(--border);border-radius:6px;background:#fff;
    font:400 14px 'Inter',sans-serif;color:var(--title);outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input::placeholder{color:var(--placeholder)}
  input:focus{border-color:var(--logo);box-shadow:0 0 0 3px rgba(74,163,176,.2)}
  .continue{
    margin-top:12px;width:100%;height:44px;border:0;border-radius:6px;
    background:var(--btn-off-bg);color:var(--btn-off-text);
    font:500 16px/1 'Inter',sans-serif;cursor:not-allowed;
    transition:background .15s,color .15s;
  }
  .continue:not(:disabled){background:var(--btn-on-bg);color:var(--btn-on-text);cursor:pointer}
  .continue:not(:disabled):hover{filter:brightness(.95)}
  .signup{margin-top:20px;font-size:13px;color:var(--placeholder)}
  .signup a{color:var(--link);font-weight:500;text-decoration:none;margin-left:3px}
  .signup a:hover{text-decoration:underline}
  .error{margin-top:8px;font-size:12px;color:#dc2626;text-align:left;min-height:0}
  .google:focus-visible,.continue:focus-visible,.signup a:focus-visible{outline:2px solid var(--logo);outline-offset:2px}
</style>
</head>

    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continuar con Google
  </button>

  <div class="divider">o sino</div>

  <form id="loginForm" novalidate>
    <input type="email" id="email" placeholder="Ingresa tu email" autocomplete="email" inputmode="email" aria-label="Email">
    <div class="error" id="error" role="alert"></div>
    <button class="continue" type="submit" id="continueBtn" disabled>Continuar</button>
  </form>

  <p class="signup">¿No tienes una cuenta? <a href="#registro">Regístrate</a></p>
</main>

<script>
  const email = document.getElementById('email');
  const btn = document.getElementById('continueBtn');
  const err = document.getElementById('error');
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  email.addEventListener('input', () => {
    btn.disabled = !re.test(email.value.trim());
    err.textContent = '';
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const value = email.value.trim();
    if (!re.test(value)) { err.textContent = 'Ingresa un email válido.'; return; }
    // TODO: conecta aquí tu backend (ej. supabase.auth.signInWithOtp({ email: value }))
    console.log('Continuar con email:', value);
  });

  document.getElementById('googleBtn').addEventListener('click', () => {
    // TODO: conecta aquí tu login con Google (ej. supabase.auth.signInWithOAuth({ provider: 'google' }))
    console.log('Continuar con Google');
  });
</script>
</body>
</html>
